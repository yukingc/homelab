apiVersion: v1
kind: Namespace
metadata: { name: stirling-pdf }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: configs, namespace: stirling-pdf }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  replicas: 1
  selector: { matchLabels: { app: stirling-pdf } }
  template:
    metadata: { labels: { app: stirling-pdf } }
    spec:
      containers:
      - name: stirling-pdf
        image: stirlingtools/stirling-pdf:latest
        ports: [{ containerPort: 8080 }]
        volumeMounts:
        - { name: configs, mountPath: /configs }
      volumes:
      - name: configs
        persistentVolumeClaim: { claimName: configs }
---
apiVersion: v1
kind: Service
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  selector: { app: stirling-pdf }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: { name: stirling-pdf, port: { number: 8080 } }
  tls:
  - hosts: [stirling-pdf-k8s]
