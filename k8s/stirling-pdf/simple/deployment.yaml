apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  labels: {app: stirling-pdf}
spec:
  replicas: 1
  selector:
    matchLabels: {app: stirling-pdf}
  template:
    metadata:
      labels: {app: stirling-pdf}
    spec:
      containers:
      - name: stirling-pdf
        image: stirlingtools/stirling-pdf:latest
        ports:
        - containerPort: 8080
        env:
        - name: DOCKER_ENABLE_SECURITY
          value: "false"
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1Gi}
        readinessProbe:
          httpGet: {path: /, port: 8080}
          initialDelaySeconds: 20
        livenessProbe:
          httpGet: {path: /, port: 8080}
          initialDelaySeconds: 60
