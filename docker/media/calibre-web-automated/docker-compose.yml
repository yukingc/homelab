services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=501
      - PGID=20
      # Edit to match your current timezone https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      # - TZ=UTC 
    volumes:
      # CW users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings ect.
      - calibre-web-automated-config:/config
      # Ingest directory (files here are processed and then removed)
      - type: bind
        source: ${CWA_ROOT:?set CWA_ROOT in the stack env}/cwa-book-ingest
        target: /cwa-book-ingest
        bind:
          create_host_path: false
      # Calibre library directory
      - type: bind
        source: ${CWA_ROOT:?set CWA_ROOT in the stack env}/calibre-library
        target: /calibre-library
        bind:
          create_host_path: false
    networks:
      - tsdproxy-net
    # ports:
    #   - 8083:8083 
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "calibre"
      homepage.group: "Media"
      homepage.name: "Calibre Web Automated"
      homepage.icon: "calibre-web-automated-book-downloader"
      homepage.href: "https://calibre.mulley-bonito.ts.net"
      homepage.description: "Calibre Web Automated is a self-hosted web application for managing and reading your eBook collection. It provides an intuitive interface for organizing, browsing, and reading your eBooks, as well as features like metadata management, cover art support, and multi-user access. With Calibre Web Automated, you can easily access your eBooks from any device with a web browser."


volumes:
  calibre-web-automated-config:

networks:
  tsdproxy-net:
    external: true
