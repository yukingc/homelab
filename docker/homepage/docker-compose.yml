services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-internal
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # ports:
    #   - 3000:3000
    volumes:
      - homepage-config:/app/config
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=gethomepage.dev,homepage.mulley-bonito.ts.net # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      - PUID=501
      - PGID=20
      - HOMEPAGE_DOCKER_INSTANCE=my-docker
    networks:
      - tsdproxy-net
      - homepage-internal
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      # INLINE DOCKER CONFIG VIA LABELS:
      homepage.docker.my-docker.host: "dockerproxy"
      homepage.docker.my-docker.port: "2375"

volumes:
  homepage-config:

networks:
  tsdproxy-net:
    external: true