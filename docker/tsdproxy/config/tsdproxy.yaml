defaultProxyProvider: default
docker:
  local:
    host: unix:///var/run/docker.sock
files: {}
tailscale:
  providers:
    default:
      authKeyFile: /run/secrets/ts_authkey
      controlUrl: https://controlplane.tailscale.com
  datadir: /data/
http:
  hostname: 0.0.0.0
  port: 8090
log:
  level: info
  json: false
proxyAccessLog: true
